# Static-frame render tests. `swf` is relative to the repository root; `gen:NAME` is a
# movie written by `cargo run --example gen_test_swfs`. `phase` records which pipeline
# stage the case validates. `known_failure` cases are run and reported (XFAIL/XPASS)
# but do not fail the suite. References in ref/ come from Ruffle (make_refs.py).

[[case]]
name = "g01_solid_shapes"
swf = "gen:g01_solid_shapes"
phase = 2

