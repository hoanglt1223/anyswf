[workspace]
members = ["."]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT"
authors = ["Henry Nguyen"]

[package]
name = "swf2c"
version = "0.1.0"
description = "Compiles SWF (AS1/AS2) movies ahead of time into C and runtime assets"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "swf2c"
path = "src/main.rs"

[[bin]]
name = "anyswf"
path = "src/anyswf/main.rs"

# Exact pins: asset output must not change under a semver-compatible update.
[dependencies]
swf = { version = "=0.3.0", default-features = false, features = ["flate2"] }
lyon = "=1.0.19"
jpeg-decoder = { version = "=0.3.2", default-features = false }
png = "=0.18.1"
flate2 = "=1.1.9"
gif = "=0.14.2"
symphonia = { version = "=0.5.5", default-features = false, features = ["mp3"] }
toml = { version = "=1.1.8", default-features = false, features = ["parse", "std", "serde"] }
