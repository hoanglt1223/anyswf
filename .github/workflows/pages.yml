name: pages

# Renders compat/*.toml into the compatibility page (tools/compat-site/generate.py) and,
# once GitHub Pages is enabled for the repository and the repository variable
# PAGES_ENABLED is set to "true", publishes it. Until then the build job still validates
# every compat file on each change.
on:
  push:
    branches: [main]
    paths: [compat/**, tools/compat-site/**, .github/workflows/pages.yml]
  pull_request:
    paths: [compat/**, tools/compat-site/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Python 3.12 on the runner image provides tomllib; the generator needs nothing else.
      - run: python3 -m unittest discover -s tools/compat-site
      - run: python3 tools/compat-site/generate.py --out _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
