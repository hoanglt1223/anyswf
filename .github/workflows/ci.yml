name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  swf2c:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: swf2c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rust-toolchain.toml pins the exact toolchain; rustup installs it on first use.
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  pc-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install SDL3 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config xvfb \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libgl1-mesa-dev libegl1-mesa-dev \
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev \
            libwayland-dev wayland-protocols libdecor-0-dev
      - run: cmake -S . -B out/linux -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build out/linux
      - run: ctest --test-dir out/linux --output-on-failure
      - name: Hello smoke test (headless, Mesa software GL)
        run: xvfb-run -a out/linux/apps/hello/hello --smoke
      - name: Render tests against Ruffle references (headless, Mesa software GL)
        run: |
          bash tests/fetch-mtasc.sh
          xvfb-run -a bash tests/render/run.sh out/linux/apps/player/anyswf-player
      - name: Export a test movie as a native Linux game and run it headless
        run: |
          out/cargo/release/anyswf build out/gen/g12_scaled_stage.swf --target linux \
            -o out/export/linux --title "Scaled Stage"
          xvfb-run -a out/export/linux/Scaled-Stage --screenshot out/export/scaled-stage.png
          python3 -c "import struct,sys; d=open('out/export/scaled-stage.png','rb').read(); sys.exit(struct.unpack('>II', d[16:24]) != (550, 400))"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: render-output
          path: out/render

  pc-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cmake -S . -B out/msvc -G "Visual Studio 17 2022" -A x64
      - run: cmake --build out/msvc --config Release --parallel
      - run: ctest --test-dir out/msvc -C Release --output-on-failure
      # No smoke run: hosted Windows runners have no OpenGL 2.1 driver.

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner image ships the Android SDK (ANDROID_HOME), NDKs and JDK 17.
      - run: cargo build --release --locked --manifest-path swf2c/Cargo.toml
      - run: cargo run --release --locked --manifest-path swf2c/Cargo.toml --example gen_test_swfs -- out/gen
      - name: Debug APK of a test movie
        run: >
          swf2c/target/release/anyswf build out/gen/g12_scaled_stage.swf --target android
          -o out/export/android --title "Scaled Stage" --touch-keys left,right,up,down,space
          --android-ndk "$ANDROID_NDK_LATEST_HOME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: out/export/android/*.apk
          if-no-files-found: error

  psp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The pspdev image is Alpine (musl), where JavaScript actions cannot run,
      # so the container is driven from the host through the same script as local builds.
      - run: bash scripts/psp-build.sh Release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: psp-eboots
          path: |
            out/psp/apps/hello/EBOOT.PBP
            out/psp/apps/player/EBOOT.PBP
          if-no-files-found: error

  corpus:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash tests/fetch-mtasc.sh
      - run: bash tests/build-corpus.sh out/corpus
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-corpus
          path: out/corpus
          if-no-files-found: error

  avm1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install SDL3 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config xvfb \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libgl1-mesa-dev libegl1-mesa-dev \
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev \
            libwayland-dev wayland-protocols libdecor-0-dev
      - run: cargo build --release --locked --manifest-path swf2c/Cargo.toml
      - run: bash tests/fetch-mtasc.sh
      - run: bash tests/build-corpus.sh out/corpus
      - name: AVM1 conformance (self-authored corpus + Ruffle tests/ruffle-avm1)
        run: >
          xvfb-run -a python3 tests/avm1/run-avm1-tests.py --swf2c swf2c/target/release/swf2c
          --out out/avm1 --corpus out/corpus --generator Ninja
      - name: AVM1 built-ins (Ruffle tests/ruffle-avm1-builtins; known gaps, regression floor)
        run: >
          xvfb-run -a python3 tests/avm1/run-avm1-tests.py --swf2c swf2c/target/release/swf2c
          --out out/avm1-builtins --ruffle tests/ruffle-avm1-builtins --min-ruffle 50 --generator Ninja
